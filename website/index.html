<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RZHK — Visual Engineering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
<style>
  /* Loader canvas covers everything from frame 1 */
  #lc { position:fixed; inset:0; z-index:300; background:#000; display:block; }
  /* Progress bar */
  #lpb { position:fixed; bottom:0; left:0; height:1px; width:0%; background:#fff; z-index:301; transition:none; }
</style>
<script>
/* =====================================================
   CINEMATIC TEXT LOADER — BLUR EFFECT
   Runs from <head> — no particles, no scaling.
   Phase 1: Text fades in with blur (large blur→small blur)
   Phase 2: Hold at sharp focus
   Phase 3: Blur out (fades while blur increases)
===================================================== */
(function(){
  var lc = document.createElement('canvas');
  lc.id = 'lc';
  var lpb = document.createElement('div');
  lpb.id = 'lpb';

  function inject() {
    (document.body || document.documentElement).appendChild(lc);
    (document.body || document.documentElement).appendChild(lpb);
    start();
  }
  if (document.body) { inject(); }
  else { document.addEventListener('DOMContentLoaded', inject); }

  var ctx, W, H, dpr, animId, animStart;
  var completed = false;
  function finishLoader() {
    if (completed) return;
    completed = true;
    cancelAnimationFrame(animId);
    lc.remove(); lpb.remove();
    if (window._loaderDone) window._loaderDone();
  }
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !completed) { e.preventDefault(); finishLoader(); }
  });
  var prgVal = 0, prgTarget = 0;

  // Animation state
  var phase = 'blur-in'; // 'blur-in' | 'hold' | 'blur-out' | 'done'
  var textAlpha = 0;
  var textBlur = 0;  // blur radius
  var blurOutStart = null;
  var blurOutDur = 0.8;

  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = lc.width  = window.innerWidth  * dpr;
    H = lc.height = window.innerHeight * dpr;
    lc.style.width  = window.innerWidth  + 'px';
    lc.style.height = window.innerHeight + 'px';
  }

  // ── Geometry helpers ────────────────────────────────
  // Responsive sizes — larger on mobile (narrow screens need bigger text)
  function textSize() {
    var vw = window.innerWidth;
    if (vw <= 480) return Math.round(W * 0.052);       // mobile: ~20px on 390px screen
    if (vw <= 900) return Math.round(W * 0.038);       // tablet
    return Math.round(W * 0.014);                       // desktop
  }
  function stmtSize() {
    var vw = window.innerWidth;
    if (vw <= 480) return Math.round(W * 0.028);       // mobile
    if (vw <= 900) return Math.round(W * 0.022);       // tablet
    return Math.round(W * 0.0073);                      // desktop
  }
  var TAG_LS  = 0.38;
  var STMT_LS = 0.04;

  function centerY() { return H * 0.5 - H * 0.04; }

  // ── Draw text at current state ────────────────────────
  function drawText(blur, alpha) {
    var cx = W / 2;
    var tagSz  = textSize();
    var stmtSz = stmtSize();
    var tagLs  = tagSz * TAG_LS;
    var stmtLs = stmtSz * STMT_LS;
    var gap    = tagSz * 2.2;
    var stmtLh = stmtSz * 1.9;
    var compH  = tagSz + gap + stmtLh * 3;
    var topY   = centerY() - compH * 0.5 + tagSz;

    ctx.save();
    ctx.textAlign = 'center';

    // Apply blur filter
    if (blur > 0.05) {
      ctx.filter = 'blur(' + blur.toFixed(2) + 'px)';
    } else {
      ctx.filter = 'none';
    }

    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#fff';
    ctx.font = '400 ' + tagSz + 'px Inter,Helvetica,Arial,sans-serif';
    ctx.letterSpacing = tagLs + 'px';
    ctx.fillText('VISUAL ENGINEERING', cx, topY);

    ctx.fillStyle = '#b0b0b0';
    ctx.font = '300 ' + stmtSz + 'px Inter,Helvetica,Arial,sans-serif';
    ctx.letterSpacing = stmtLs + 'px';
    var sy = topY + gap;
    ctx.fillText('I craft cinematic visual experiences', cx, sy);
    ctx.fillText('where architecture, automotive', cx, sy + stmtLh);
    ctx.fillText('and storytelling meet precision and emotion.', cx, sy + stmtLh * 2);

    ctx.filter = 'none';
    ctx.restore();
  }

  // ── Main animation loop ─────────────────────────────
  function frame(now) {
    if (completed) return;
    if (!animStart) animStart = now;
    var elapsed = (now - animStart) / 1000;

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // progress bar
    prgVal += (prgTarget - prgVal) * 0.055;
    lpb.style.width = (prgVal * 100) + '%';

    if (phase === 'blur-in') {
      // t=0→0.35s: pure black
      // t=0.35→0.5s: transition to blur-in phase (no-op)
      // t=0.5→1.0s: fade in with blur ramping down smoothly (0.5s)
      // Start: big blur (8px), alpha 0
      // End: small blur (0.5px), alpha 1
      if (elapsed < 0.5) {
        // Black screen for 0.5s before text appears
        textAlpha = 0;
        textBlur = 8;
      } else {
        var t = Math.min(1, (elapsed - 0.5) / 0.5);
        textAlpha = t;
        textBlur = 8 * (1 - t) + 0.5;  // 8px → 0.5px
        if (t >= 1) phase = 'hold';
      }
    } else if (phase === 'hold') {
      // t=1.0→3.0s: hold sharp and visible (2.0s to see text clearly)
      textAlpha = 1;
      textBlur = 0.5;
      if (elapsed >= 3.0) phase = 'blur-out';
    } else if (phase === 'blur-out') {
      // t=3.0→4.5s: fade out with blur ramping up smoothly (1.5s into darkness)
      if (!blurOutStart) blurOutStart = now;
      var et = (now - blurOutStart) / 1000;
      var t = Math.min(1, et / 1.5);
      textAlpha = 1 - t;
      textBlur = 0.5 + t * t * 8;  // 0.5px → 8.5px, accelerating
      if (t >= 1) {
        phase = 'done';
        lc.style.transition = 'opacity 0.3s ease';
        lc.style.opacity = '0';
        setTimeout(finishLoader, 320);
        return;
      }
    }

    drawText(textBlur, textAlpha);
    animId = requestAnimationFrame(frame);
  }

  function start() {
    ctx = lc.getContext('2d');
    resize();
    prgTarget = 0.3;
    setTimeout(function(){ prgTarget = 0.65; }, 500);
    setTimeout(function(){ prgTarget = 0.85; }, 1100);
    setTimeout(function(){ prgTarget = 1.0;  }, 1900);
    animId = requestAnimationFrame(frame);
  }

  window.addEventListener('resize', function() { resize(); });
})();
</script>
<style>
  /* ---------- ROOT TOKENS ---------- */
  :root {
    --bg: #000;
    --fg: #ffffff;
    --fg-dim: #b0b0b0;
    --fg-mute: #808080;
    --accent: #dc143c;
    --rule: rgba(255,255,255,0.14);
    --rule-strong: rgba(255,255,255,0.28);
    --font: 'Inter', 'Futura PT', 'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html { font-size: 115%; }
  html, body { width:100%; height:100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    font-weight: 300;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  /* ---------- HERO STAGE ---------- */
  .stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #000;
  }
  .motion-field {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    opacity: 0;
    transition: opacity 2.4s ease;
  }
  .motion-field.visible { opacity: 1; }
  @media (prefers-reduced-motion: reduce) {
    .motion-field { transition: none; }
  }

  /* center seam blend — keeps subjects on the sides bright */
  .seam {
    position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0.55) 50%, rgba(0,0,0,0) 70%, rgba(0,0,0,0) 100%),
      radial-gradient(140% 100% at 50% 60%, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.5) 100%);
    pointer-events: none;
  }

  /* subtle vertical guide lines */
  .guides {
    position: absolute; inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(90deg, transparent 0, transparent calc(16.666% - 1px), rgba(255,255,255,0.05) calc(16.666%), transparent calc(16.666% + 1px)),
      linear-gradient(90deg, transparent 0, transparent calc(50% - 1px),     rgba(255,255,255,0.06) calc(50%),     transparent calc(50% + 1px)),
      linear-gradient(90deg, transparent 0, transparent calc(83.333% - 1px), rgba(255,255,255,0.05) calc(83.333%), transparent calc(83.333% + 1px));
  }

  /* ---------- NAV ---------- */
  .nav {
    position: absolute;
    top: 2.25rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 40;
    display: flex;
    font-size: 0.78rem;
    letter-spacing: 0.28em;
    font-weight: 400;
  }
  .nav button {
    position: relative;
    padding: 6px 2px;
    opacity: 0.92;
    transition: opacity .3s ease;
  }
  .nav button::after {
    content: '';
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 0;
    height: 1px;
    background: #fff;
    transition: width .35s ease, left .35s ease;
  }
  .nav button:hover { opacity: 1; }
  .nav button:hover::after { width: 100%; left: 0; }
  .nav button:hover::after { width: 24px; left: 50%; transform: translateX(-50%); }

  /* ---------- CENTER ---------- */
  .center {
    position: absolute;
    left: 50%; top: 53%;
    transform: translate(-50%, -50%);
    z-index: 30;
    display: flex; flex-direction: column; align-items: center;
    width: min(90vw, 960px);
    text-align: center;
    pointer-events: none;
    will-change: transform;
  }
  .center > * { pointer-events: auto; }

  .logo-wrap {
    width: clamp(616px, 85.8vw, 1320px);
    aspect-ratio: 920 / 100;
    position: relative;
    pointer-events: auto;
  }
  .logo-canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    z-index: 20;
    pointer-events: none;
    visibility: hidden;
  }
  .logo-canvas.ready { visibility: visible; }

  .tagline {
    margin-top: 4.5rem;
    font-size: 0.82rem;
    letter-spacing: 0.58em;
    text-indent: 0.58em;
    font-weight: 400;
    color: #fff;
    opacity: 0;
    filter: blur(8px);
    transition: opacity 1.0s ease 0.8s, filter 1.0s ease 0.8s;
  }
  .tagline.visible {
    opacity: 1;
    filter: blur(0px);
  }

  .statement {
    margin-top: 2.6rem;
    max-width: 440px;
    font-size: 0.92rem;
    line-height: 1.75;
    letter-spacing: 0.04em;
    color: var(--fg-dim);
    font-weight: 300;
    text-wrap: balance;
    opacity: 0;
    filter: blur(8px);
    transition: opacity 1.0s ease 1.0s, filter 1.0s ease 1.0s;
  }
  .statement.visible {
    opacity: 1;
    filter: blur(0px);
  }

  .cta {
    margin-top: 3rem;
    display: inline-flex; align-items: center; gap: 14px;
    font-size: 0.72rem;
    letter-spacing: 0.32em;
    padding: 14px 2px 10px;
    border: 0;
    color: #fff;
    font-weight: 400;
    position: relative;
  }
  .cta::after {
    content: '';
    position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
    width: 44px; height: 1px; background: #fff;
    transition: width .5s cubic-bezier(.2,.7,.2,1);
  }
  .cta:hover::after { width: 100%; }
  .cta .arrow {
    display: inline-block;
    transform: translateY(-1px);
    transition: transform .4s ease;
  }
  .cta:hover .arrow { transform: translate(4px, -1px); }

  /* ---------- SERVICE STRIP ---------- */
  .services {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    margin: 0 auto;
    width: min(95vw, 1600px);
    z-index: 35;
    padding: 1.5rem 2.5rem 1.75rem;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 60%, rgba(0,0,0,0.72) 100%);
  }
  .svc {
    padding: 1.1rem 1.25rem 0.25rem;
    text-align: left;
    border-left: 1px solid var(--rule);
    cursor: pointer;
    position: relative;
    transition: background .35s ease, transform .45s cubic-bezier(.2,.7,.2,1);
  }
  .svc:first-child { border-left: 0; }
  .svc::before {
    content: '';
    position: absolute;
    left: 0; top: 0;
    width: 1px; height: 0;
    background: #fff;
    transition: height .45s cubic-bezier(.2,.7,.2,1);
  }
  .svc:first-child::before { left: -1px; display: none; }
  .svc:hover::before { height: 100%; }
  .svc:hover { background: rgba(255,255,255,0.02); }
  .svc .num {
    font-size: 0.6rem;
    letter-spacing: 0.3em;
    color: var(--fg-mute);
    font-variant-numeric: tabular-nums;
  }
  .svc .title {
    margin-top: 0.9rem;
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.22em;
    line-height: 1.35;
    text-transform: uppercase;
    color: #fff;
    min-height: 2.6em;
  }
  .svc .desc {
    margin-top: 0.8rem;
    font-size: 0.72rem;
    line-height: 1.6;
    letter-spacing: 0.03em;
    color: var(--fg-dim);
    font-weight: 300;
    text-wrap: pretty;
  }
  .svc .more {
    margin-top: 0.9rem;
    display: inline-flex; gap: 8px; align-items: center;
    font-size: 0.6rem; letter-spacing: 0.3em;
    color: var(--fg-mute);
    transition: color .3s ease;
  }
  .svc:hover .more { color: #fff; }

  /* ---------- FOOTER ---------- */
  .foot {
    position: absolute;
    left: 2.5rem; right: 2.5rem; bottom: -999px; /* hidden; strip lives here */
  }
  .bottom-meta {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    z-index: 36;
    padding: 0.65rem 2.5rem;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.6rem; letter-spacing: 0.32em;
    color: var(--fg-mute);
    border-top: 1px solid rgba(255,255,255,0.06);
    background: rgba(0,0,0,0.55);
    pointer-events: none;
  }
  .bottom-meta a { pointer-events: auto; transition: color .25s ease; }
  .bottom-meta a:hover { color: #fff; }
  .bottom-meta .social { display: flex; gap: 2rem; }
  .bottom-meta .copy   { opacity: 0.8; }
  .bottom-meta .scroll { display:flex; gap:12px; align-items:center; }
  .bottom-meta .scroll .line { width: 32px; height:1px; background: var(--fg-mute); position: relative; overflow: hidden; }
  .bottom-meta .scroll .line::after {
    content:''; position:absolute; left:-50%; top:0; width:50%; height:100%;
    background: #fff; animation: slide 2.4s cubic-bezier(.4,.1,.2,1) infinite;
  }
  @keyframes slide { 0% { left:-50%; } 60% { left:100%; } 100% { left:100%; } }

  /* raise strip above meta */
  .services { bottom: 32px; padding-bottom: 1.5rem; }
  .bottom-meta { height: 32px; padding-top: 0; padding-bottom: 0; }

  /* ---------- LOADER ---------- */
  .loader {
    position: fixed; inset: 0; z-index: 200;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    transition: opacity .7s ease, transform .7s ease;
  }

  .loader.done { opacity: 0; pointer-events: none; transform: scale(0.98); }

  /* ---------- ENTRY ANIMATIONS ---------- */
  /* opacity-only so we never clobber positional transforms (translateX(-50%) etc) */
  .enter { opacity: 0; transition: opacity .9s ease; }
  .enter.show { opacity: 1; }

  /* ---------- MODAL ---------- */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.78);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none;
    transition: opacity .35s ease;
    z-index: 80;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-backdrop.open { opacity: 1; pointer-events: auto; }
  .modal {
    width: min(620px, 92vw);
    background: #050505;
    border: 1px solid #222;
    padding: 2.4rem 2.4rem 2rem;
    position: relative;
    transform: translateY(14px) scale(0.98);
    opacity: 0;
    transition: opacity .45s ease, transform .45s cubic-bezier(.2,.7,.2,1);
  }
  .modal-backdrop.open .modal { opacity: 1; transform: translateY(0) scale(1); }
  .modal .close {
    position: absolute; top: 1rem; right: 1rem;
    width: 36px; height: 36px;
    display:flex; align-items:center; justify-content:center;
    color: var(--fg-dim);
    transition: color .25s ease, transform .25s ease;
  }
  .modal .close:hover { color: #fff; transform: rotate(90deg); }
  .modal .eyebrow {
    font-size: 0.6rem; letter-spacing: 0.35em; color: var(--fg-mute);
  }
  .modal h3 {
    margin-top: 0.5rem;
    font-size: 1.6rem;
    letter-spacing: 0.14em;
    font-weight: 500;
    text-transform: uppercase;
  }
  .modal .rule { height: 1px; background: #222; margin: 1.4rem 0; }
  .modal p {
    font-size: 0.92rem; line-height: 1.75; color: var(--fg-dim); font-weight: 300;
  }
  .modal .tags { margin-top: 1.4rem; display:flex; flex-wrap:wrap; gap: 0.5rem; }
  .modal .tags span {
    font-size: 0.58rem; letter-spacing: 0.3em;
    padding: 6px 10px; border: 1px solid #222; color: var(--fg-dim);
  }

  /* ---------- UTIL ---------- */
  .no-touch { user-select: none; -webkit-user-drag: none; }

  @media (max-width: 900px) {
    /* ---- NAV: smaller & tighter ---- */
    .nav {
      gap: 1.6rem;
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      top: 1.2rem;
    }
    /* ---- CENTER: shift up slightly so it clears the bottom strip ---- */
    .center {
      top: 44%;
      width: 90vw;
    }

    /* ---- LOGO: smaller on mobile ---- */
    .logo-wrap {
      width: min(88vw, 420px);
    }

    /* ---- TAGLINE & STATEMENT ---- */
    .tagline {
      font-size: 0.7rem;
      letter-spacing: 0.42em;
      margin-top: 1.6rem;
    }
    .statement {
      font-size: 0.82rem;
      margin-top: 1.8rem;
      max-width: 82vw;
      line-height: 1.7;
    }

    /* ---- CTA ---- */
    .cta {
      margin-top: 2rem;
      font-size: 0.65rem;
    }

    /* ---- SERVICE STRIP: 2-col grid ---- */
    .services {
      grid-template-columns: 1fr 1fr;
      padding: 0.75rem 1rem 0.75rem;
      gap: 0;
    }
    .svc {
      padding: 0.85rem 0.9rem 0.6rem;
      border-left: 1px solid var(--rule);
      border-top: 1px solid var(--rule);
    }
    .svc:nth-child(1),
    .svc:nth-child(2) {
      border-top: none;
    }
    .svc:nth-child(odd) {
      border-left: none;
    }
    /* 5th item spans full width */
    .svc:nth-child(5) {
      grid-column: 1 / -1;
      border-left: none;
    }
    .svc .title {
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      min-height: auto;
      margin-top: 0.6rem;
    }
    .svc .desc {
      display: none;
    }
    .svc .num {
      font-size: 0.55rem;
    }
    .svc .more {
      display: none;
    }

    /* ---- BOTTOM META ---- */
    .bottom-meta {
      padding: 0.5rem 1rem;
      font-size: 0.55rem;
      letter-spacing: 0.22em;
    }
    .bottom-meta .scroll { display: none; }
    .bottom-meta .social { gap: 1.2rem; }

    /* ---- SEAM: hide vertical seam on mobile ---- */
    .seam {
      background:
        radial-gradient(140% 80% at 50% 80%, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.55) 100%);
    }
    .guides { display: none; }
  }

  /* ---- Very small phones ---- */
  @media (max-width: 400px) {
    .nav { gap: 1.1rem; font-size: 0.62rem; }
    .logo-wrap { width: 92vw; }
    .tagline { font-size: 0.62rem; letter-spacing: 0.34em; }
    .statement { font-size: 0.76rem; max-width: 90vw; }
    .services { padding: 0.6rem 0.75rem; }
    .svc .title { font-size: 0.65rem; }
  }

  /* ============================================================
     MOBILE SERVICES BUTTON + DRAWER
     Hidden on desktop, shown on mobile
  ============================================================ */
  .mob-svc-btn,
  .mob-svc-drawer,
  .mob-svc-overlay {
    display: none;
  }
  @media (max-width: 900px) {
    /* Hide the regular services strip */
    .services { display: none !important; }

    /* Floating pill button at bottom center */
    .mob-svc-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      position: fixed;
      bottom: 1.6rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      padding: 0.75rem 1.5rem;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 40px;
      color: #fff;
      font-family: var(--font);
      font-size: 0.68rem;
      letter-spacing: 0.32em;
      font-weight: 400;
      cursor: pointer;

/* ================= PARALLAX ================= */

/* ================= PARTICLE LOGO ================= */
// Perspective dot rain. All geometry uses CSS pixels before raster scaling.
const motionField = document.getElementById('motionField');
const fieldContext = motionField.getContext('2d');
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
let fieldWidth = 0, fieldHeight = 0, fieldDpr = 1;
let fieldFrame = null, fieldLast = 0, fieldTime = 0;
let fieldX = 0.5, fieldY = 0.5;
let rainStreams = [];
const releasedDots = [];
let lastDotRelease = -Infinity;
const mouseMomentum = {x: 0, y: 0, time: 0, px: null, py: null};
window.addEventListener('mousemove', e => {
  const now = performance.now();
  const dt = (now - mouseMomentum.time) / 1000;
  if (mouseMomentum.px != null && dt > 0 && dt < 0.15) {
    mouseMomentum.x = Math.max(-1000, Math.min(1000, (e.clientX - mouseMomentum.px) / dt));
    mouseMomentum.y = Math.max(-1000, Math.min(1000, (e.clientY - mouseMomentum.py) / dt));

});

function projectRain(x, y, z) {
  const scale = 620 / (620 + z);
  return {
    x: fieldWidth * 0.5 + (x - (fieldX - 0.5) * 100) * scale,
    y: fieldHeight * 0.46 + (y - (fieldY - 0.5) * 65) * scale,
    scale
  };
}
function centerVisibility(x, y) {
  // Leave a quiet halo directly behind the lettering, while keeping enough
  // activity there for logo particles to visibly hand off into the field.
  const dx = (x - fieldWidth * 0.5) / (fieldWidth * 0.34);
  const dy = (y - fieldHeight * 0.5) / (fieldHeight * 0.29);
  return 0.16 + 0.84 * (1 - Math.exp(-(dx * dx + dy * dy) * 1.6));
}
function releaseLogoDot(p, rect, now) {
  if (reducedMotion.matches || now - lastDotRelease < 55 || releasedDots.length >= 64) return false;
  const x = rect.left + p.x / dpr, y = rect.top + p.y / dpr;
  const inertia = Math.exp(-Math.max(0, now - mouseMomentum.time) / 120) * 0.16;
  const gyroVX = globalThis._gyroVelocityX || 0;
  const gyroVY = globalThis._gyroVelocityY || 0;
  releasedDots.push({
    x: x - fieldWidth * 0.5 + (fieldX - 0.5) * 100,
    y: y - fieldHeight * 0.46 + (fieldY - 0.5) * 65,
    z: 0, vx: p.vx / dpr * 16 + mouseMomentum.x * inertia + gyroVX * 0.32,
    vy: p.vy / dpr * 14 + mouseMomentum.y * inertia + gyroVY * 0.32,
    size: p.size / dpr, age: 0, target: null, joinedAt: null,
    // Each handoff takes a slightly different route before settling into rain.
    chaosSeed: Math.random() * Math.PI * 2,
    chaosAmount: 8 + Math.random() * 20,
    chaosRate: 5.5 + Math.random() * 5
  });
  lastDotRelease = now;
  return true;
}

function resizeField() {
  fieldWidth = window.innerWidth;
  fieldHeight = window.innerHeight;
  fieldDpr = Math.min(window.devicePixelRatio || 1, 1.5);
  motionField.width = Math.round(fieldWidth * fieldDpr);
  motionField.height = Math.round(fieldHeight * fieldDpr);
  rainStreams = Array.from({length: fieldWidth < 640 ? 76 : 178}, () => {
    const z = 100 + Math.random() * 1900;
    const scale = 620 / (620 + z);
    return {
      x: (Math.random() - 0.5) * (fieldWidth + 180) / scale,
      y: (Math.random() - 0.5) * fieldHeight * 2 / scale,
      z, speed: 95 + Math.random() * 125,
      count: 42 + Math.floor(Math.random() * 38),
      gap: 4.6 + Math.random() * 5.2,
      seed: Math.random() * 1000,
      changeRate: 14 + Math.random() * 12,
      pulseSpeed: 9 + Math.random() * 12,
      pulseOffset: Math.random() * 30
    };
  }).sort((a, b) => b.z - a.z);

}
function drawField(now) {
  fieldFrame = null;
  if (document.hidden) return;
  const elapsed = fieldLast ? Math.min((now - fieldLast) / 1000, 0.05) : 0;
  if (!reducedMotion.matches && elapsed < 1 / 30 && fieldLast) {
    fieldFrame = requestAnimationFrame(drawField);
    return;
  }
  fieldLast = now;
  if (!reducedMotion.matches) fieldTime += elapsed;
  const t = fieldTime;
  // Keep the rain fixed in the page while the logo alone responds to mouse movement.
  fieldX = 0.5;
  fieldY = 0.5;
  const c = fieldContext, w = fieldWidth, h = fieldHeight;
  c.setTransform(fieldDpr, 0, 0, fieldDpr, 0, 0);
  c.clearRect(0, 0, w, h);
  const dt = reducedMotion.matches ? 0 : elapsed;
  c.fillStyle = '#fff';
  for (const stream of rainStreams) {
    stream.y += stream.speed * dt;
    const head = projectRain(stream.x, stream.y, stream.z);
    if (head.y - stream.count * stream.gap * head.scale > h + 30) {
      stream.y = (-h * 0.46 - 40) / head.scale + (fieldY - 0.5) * 65;
    }
    for (let j = 0; j < stream.count; j++) {
      const point = projectRain(stream.x, stream.y - j * stream.gap, stream.z);
      if (point.y < -4 || point.y > h + 4) continue;
      const tail = (1 - j / stream.count) ** 1.6;
      // Random round/square changes provide the changing-character rhythm.
      const change = Math.floor(t * stream.changeRate + j * 0.43);
      const noise = Math.abs(Math.sin(stream.seed * 12.9898 + j * 78.233 + change * 37.719));
      const pulseAt = (t * stream.pulseSpeed + stream.pulseOffset) % (stream.count + 8) - 4;
      const pulse = Math.exp(-Math.pow(j - pulseAt, 2) / 2.8);
      const brightness = Math.min(1, 0.65 + pulse * 0.25 + (j === 0 ? 0.1 : 0));

  for (let i = releasedDots.length - 1; i >= 0; i--) {
    const dot = releasedDots[i];
    updateReleasedDot(dot, dt, t);
    const point = projectRain(dot.x, dot.y, dot.z);
    const fade = Math.max(0, 1 - dot.age / 8);
    const merge = Math.min(1, dot.age / 2.5);
    const visibility = 1 - merge + merge * centerVisibility(point.x, point.y);
    const change = Math.floor(t * 22 + dot.age * 5);
    const square = Math.sin(dot.x * 0.017 + change * 2.31) > 0;
    c.globalAlpha = fade * visibility * (1 - merge * 0.65);
    const accent = dot.joinedAt == null ? 0 : Math.max(0, 1 - (t - dot.joinedAt) / 0.5);
    if (accent > 0) c.globalAlpha = 0.65 + 0.35 * accent;
    const size = Math.max(0.45, dot.size * point.scale);
    drawRainShape(c, point.x, point.y, size, square);
    if (accent > 0) {
      c.globalAlpha = accent * 0.15;
      c.fillRect(point.x - 1.5, point.y - 1.5, size + 3, size + 3);
    }

  }

}
function drawRainShape(c, x, y, size, square) {
  if (square) c.fillRect(x, y, size, size);
  else {

    c.arc(x + size / 2, y + size / 2, size * 0.56, 0, Math.PI * 2);

}
function updateReleasedDot(dot, dt, time) {
  dot.age += dt;

  const chaosAmount = dot.chaosAmount || 0;
  const chaosRate = dot.chaosRate || 6;
  // A short, damped drift preserves direction without a forceful launch.
  if (dot.age < 0.35 || !rainStreams.length) {
    const drift = Math.sin(time * chaosRate + chaosSeed) * chaosAmount * 0.45;
    dot.vx += drift * dt;
    dot.vy += Math.cos(time * (chaosRate * 0.8) + chaosSeed) * chaosAmount * 0.18 * dt;
    dot.vx *= Math.exp(-dt * 2.8);
    dot.vy += (45 - dot.vy) * (1 - Math.exp(-dt * 1.5));
    dot.x += dot.vx * dt; dot.y += dot.vy * dt;
    return;
  }
  if (!dot.target) {
    const origin = projectRain(dot.x, dot.y, dot.z);
    let best = Infinity;
    for (const stream of rainStreams) {
      const scale = 620 / (620 + stream.z);
      const worldY = (origin.y - fieldHeight * 0.46) / scale + (fieldY - 0.5) * 65;
      const index = Math.max(0, Math.min(stream.count - 1, Math.round((stream.y - worldY) / stream.gap)));
      const point = projectRain(stream.x, stream.y - index * stream.gap, stream.z);
      const score = (point.x - origin.x) ** 2 + (point.y - origin.y) ** 2;
      if (score < best) { best = score; dot.target = {stream, index}; }
    }
  }
  const {stream, index} = dot.target;
  const targetY = stream.y - index * stream.gap;
  if (dot.joinedAt != null) {
    dot.x = stream.x; dot.y = targetY; dot.z = stream.z;
    return;
  }
  // A fading, orbit-like offset breaks up the perfect spring curve. It vanishes
  // before contact, so the dot still reads as joining one exact rain trail.
  const settle = Math.min(1, (dot.age - 0.35) / 1.25);
  const chaos = chaosAmount * (1 - settle) * (1 - settle);
  const phase = time * chaosRate + chaosSeed;
  const aimX = stream.x + Math.sin(phase) * chaos;
  const aimY = targetY + Math.cos(phase * 1.37) * chaos * 0.48;
  dot.vx += ((aimX - dot.x) * 15 - dot.vx * 7.2) * dt;
  dot.vy += ((aimY - dot.y) * 15 + (stream.speed - dot.vy) * 7.2) * dt;
  dot.x += dot.vx * dt; dot.y += dot.vy * dt;
  dot.z += (stream.z - dot.z) * (1 - Math.exp(-dt * 3.8));
  const point = projectRain(dot.x, dot.y, dot.z);
  const targetPoint = projectRain(stream.x, targetY, stream.z);
  if (Math.hypot(point.x - targetPoint.x, point.y - targetPoint.y) < 2 && Math.abs(dot.z - stream.z) < 25) {
    dot.x = stream.x; dot.y = targetY; dot.z = stream.z;
    dot.joinedAt = time;
  }
}

  cancelAnimationFrame(fieldFrame);
  fieldLast = 0;
  fieldFrame = requestAnimationFrame(drawField);

window.addEventListener('pointermove', e => {

window.addEventListener('resize', () => { resizeField(); startField(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) cancelAnimationFrame(fieldFrame); else startField();
});
reducedMotion.addEventListener('change', startField);
resizeField();
startField();

const LOGO_PATHS = [
  'M 0.8900,0.2200 L 0.9500,0.2200 L 0.9500,-0.2400 L 0.8900,-0.2400 L 0.8900,-0.0400 L 0.3600,-0.0400 L 0.3600,-0.2400 L 0.3000,-0.2400 L 0.3000,0.2200 L 0.3600,0.2200 L 0.3600,0.0200 L 0.8900,0.0200 Z',
  'M -0.8300,-0.1800 L -0.2900,-0.1800 L -0.2900,-0.2400 L -0.9500,-0.2400 L -0.9500,-0.1900 L -0.4500,0.1600 L -0.9500,0.1600 L -0.9500,0.2200 L -0.2900,0.2200 L -0.2900,0.2000 Z',
  'M -1.6500,-0.2400 L -2.0000,0.0000 L -1.6500,0.0000 L -1.6467,0.0004 L -1.6421,0.0018 L -1.6364,0.0041 L -1.6300,0.0074 L -1.6232,0.0119 L -1.6162,0.0175 L -1.6095,0.0244 L -1.6033,0.0326 L -1.5980,0.0422 L -1.5937,0.0532 L -1.5910,0.0658 L -1.5900,0.0800 L -1.5910,0.0942 L -1.5937,0.1068 L -1.5980,0.1178 L -1.6033,0.1274 L -1.6095,0.1356 L -1.6162,0.1425 L -1.6232,0.1481 L -1.6300,0.1526 L -1.6364,0.1559 L -1.6421,0.1582 L -1.6467,0.1596 L -1.6500,0.1600 L -2.1700,0.1600 L -2.2600,0.2200 L -1.6500,0.2200 L -1.6432,0.2195 L -1.6334,0.2179 L -1.6212,0.2148 L -1.6074,0.2100 L -1.5926,0.2031 L -1.5775,0.1937 L -1.5628,0.1817 L -1.5493,0.1667 L -1.5375,0.1483 L -1.5282,0.1262 L -1.5222,0.1003 L -1.5200,0.0700 L -1.5222,0.0443 L -1.5282,0.0222 L -1.5375,0.0033 L -1.5493,-0.0126 L -1.5628,-0.0257 L -1.5775,-0.0362 L -1.5926,-0.0445 L -1.6074,-0.0507 L -1.6213,-0.0552 L -1.6334,-0.0580 L -1.6432,-0.0595 L -1.6500,-0.0600 L -1.8000,-0.0600 L -1.5200,-0.2400 Z',
  'M 2.2400,0.2200 L 1.9200,-0.0100 L 2.2600,-0.2500 L 2.1300,-0.2500 L 1.8600,-0.0600 L 1.5800,-0.2500 L 1.5800,0.2200 L 1.6400,0.2200 L 1.6400,-0.1300 L 2.1400,0.2200 Z'
];
// Logo coords are in roughly x:[-2.26, 2.26], y:[-0.25, 0.22] (note: y is flipped via scale(1,-1))

const logoCanvas = document.getElementById('logoCanvas');
const logoWrap = document.getElementById('logoWrap');
const lctx = logoCanvas.getContext('2d');
let particles = [];
let logoMouseX = -9999, logoMouseY = -9999;
let logoActive = false;
let animStart = 0;
let logoFrame = null;
let logoStarted = false;
let logoWidth = 0, logoHeight = 0;
let dpr = Math.min(2, window.devicePixelRatio || 1);

function sampleLogoPoints(targetWidth, targetHeight) {
  // Build offscreen canvas, draw the SVG paths filled, then sample non-empty pixels
  const off = document.createElement('canvas');
  // Source bounds
  const minX = -2.30, maxX = 2.30, minY = -0.30, maxY = 0.25;
  const srcW = maxX - minX;
  const srcH = maxY - minY;
  const sampleW = Math.min(900, Math.floor(targetWidth));
  const sampleH = Math.floor(sampleW * (srcH / srcW));
  off.width = sampleW; off.height = sampleH;
  const oc = off.getContext('2d');
  oc.fillStyle = '#fff';
  // Map source coords to canvas: translate(-minX, -minY), scale(sampleW/srcW, -sampleH/srcH) for y-flip
  oc.save();
  oc.translate(0, sampleH);
  oc.scale(sampleW / srcW, -sampleH / srcH);
  oc.translate(-minX, -minY);
  // Logo's own transform was scale(100, -100); but we work directly in source coords, applying y-flip via canvas transform.
  // Original svg has scale(100, -100) — we accept paths as-is; the y-flip we applied above re-flips them upright.
  for (const d of LOGO_PATHS) {
    const p = new Path2D(d);
    oc.fill(p);
  }
  oc.restore();
  const img = oc.getImageData(0, 0, sampleW, sampleH);
  const points = [];
  const step = 3; // density
  for (let y = 0; y < sampleH; y += step) {
    for (let x = 0; x < sampleW; x += step) {
      const a = img.data[(y * sampleW + x) * 4 + 3];
      if (a > 128) {
        points.push([x / sampleW, y / sampleH]);
      }
    }
  }
  return points;
}

function buildParticles() {
  const rect = logoWrap.getBoundingClientRect();
  if (!rect.width) return;
  dpr = Math.min(2, window.devicePixelRatio || 1);
  logoCanvas.width = window.innerWidth * dpr;
  logoCanvas.height = window.innerHeight * dpr;
  // Keep the logo geometry local; its drawing surface spans the whole stage.
  const W = rect.width * dpr, H = rect.height * dpr;
  logoWidth = W; logoHeight = H;
  const points = sampleLogoPoints(rect.width * dpr, rect.height * dpr);
  particles = points.map(([nx, ny]) => {
    const tx = nx * W;
    const ty = ny * H;
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.max(W, H) * (0.7 + Math.random() * 1.1);
    const sx = W * 0.5 + Math.cos(angle) * dist;
    const sy = H * 0.5 + Math.sin(angle) * dist;
    const driftSeed = Math.random() * Math.PI * 2;
    const driftAmp = 14 + Math.random() * 26;
    const driftFreq = 0.3 + Math.random() * 0.6;
    return {
      x: sx, y: sy, tx, ty, ox: tx, oy: ty,
      vx: 0, vy: 0,
      size: (Math.random() * 0.9 + 0.6) * dpr,
      delay: Math.random() * 2.4,
      duration: 3.0 + Math.random() * 2.0,
      driftSeed, driftAmp, driftFreq,
    };
  });
}

function renderParticles(now) {
  if (!animStart) animStart = now;
  const elapsed = (now - animStart) / 1000;
  const W = logoCanvas.width, H = logoCanvas.height;
  lctx.clearRect(0, 0, W, H);
  // mouse in canvas space — use gyro position on mobile if available
  const rect = logoWrap.getBoundingClientRect();
  const canvasRect = logoCanvas.getBoundingClientRect();
  lctx.save();
  lctx.translate((rect.left - canvasRect.left) * dpr, (rect.top - canvasRect.top) * dpr);
  const isTouchDevice = 'ontouchstart' in window;
  const rawX = (isTouchDevice && window._gyroLogoX != null) ? window._gyroLogoX : logoMouseX;
  const rawY = (isTouchDevice && window._gyroLogoY != null) ? window._gyroLogoY : logoMouseY;
  const mxC = (rawX - rect.left) * dpr;
  const myC = (rawY - rect.top) * dpr;
  const repelR = 60 * dpr;
  const repelR2 = repelR * repelR;

  for (const p of particles) {
    // formation phase: slow random-wander tween toward target with delay
    const t = Math.max(0, Math.min(1, (elapsed - p.delay) / p.duration));
    // smoothstep ease for slow start + slow end
    const ease = t * t * (3 - 2 * t);

    if (t < 1) {
      // base interpolated position
      const baseX = p.x + (p.tx - p.x) * (0.012 + ease * 0.04);
      const baseY = p.y + (p.ty - p.y) * (0.012 + ease * 0.04);
      // curl/drift fades out as particle nears target
      const drift = (1 - ease) * p.driftAmp * dpr;
      const wob = elapsed * p.driftFreq + p.driftSeed;
      p.x = baseX + Math.cos(wob) * drift * 0.06;
      p.y = baseY + Math.sin(wob * 1.3) * drift * 0.06;
      p.vx *= 0.9; p.vy *= 0.9;
    } else {
      // physics phase
      const dxh = p.ox - p.x;
      const dyh = p.oy - p.y;
      p.vx += dxh * 0.08;
      p.vy += dyh * 0.08;
      if (logoActive || (isTouchDevice && window._gyroLogoX != null)) {
        const dxm = p.x - mxC;
        const dym = p.y - myC;
        const d2 = dxm * dxm + dym * dym;
        if (d2 < repelR2 && d2 > 0.01) {
          const d = Math.sqrt(d2);
          const f = (1 - d / repelR) * 6 * dpr;
          p.vx += (dxm / d) * f;
          p.vy += (dym / d) * f;
          const gyroRelease = isTouchDevice && (window._gyroMotion || 0) > 0.12;
          const releaseDistance = gyroRelease ? 4.5 : 7;
          if (d < repelR * 0.8 && now > (p.releaseAfter || 0)
              && (!isTouchDevice || gyroRelease)
              && Math.hypot(p.x - p.ox, p.y - p.oy) > releaseDistance * dpr
              && releaseLogoDot(p, rect, now)) {
            // Hand off this dot to the rain; its home point quietly reforms.
            p.releasedAt = now;
            p.releaseAfter = now + 3500;
            p.x = p.ox; p.y = p.oy; p.vx = 0; p.vy = 0;
          }
        }
      }
      p.vx *= 0.82;
      p.vy *= 0.82;
      p.x += p.vx;
      p.y += p.vy;
    }
    // particle fades in as it approaches target
    lctx.globalAlpha = t < 1 ? (0.25 + ease * 0.75) : 1;
    if (p.releasedAt) lctx.globalAlpha *= Math.min(1, (now - p.releasedAt) / 1200);
    lctx.fillStyle = '#fff';
    lctx.fillRect(p.x, p.y, p.size, p.size);
  }
  lctx.globalAlpha = 1;
  lctx.restore();
  logoFrame = requestAnimationFrame(renderParticles);
}

function initLogo() {
  if (logoStarted) return;
  logoStarted = true;
  cancelAnimationFrame(logoFrame);
  buildParticles();
  animStart = 0;
  logoCanvas.classList.add('ready');
  logoFrame = requestAnimationFrame(renderParticles);
}

function resizeLogo() {
  if (!logoStarted) return;
  const rect = logoWrap.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  const nextDpr = Math.min(2, window.devicePixelRatio || 1);
  const nextWidth = rect.width * nextDpr, nextHeight = rect.height * nextDpr;
  const sx = nextWidth / logoWidth, sy = nextHeight / logoHeight;
  for (const p of particles) {
    p.x *= sx; p.tx *= sx; p.ox *= sx; p.vx *= sx;
    p.y *= sy; p.ty *= sy; p.oy *= sy; p.vy *= sy;
    p.size *= nextDpr / dpr;
  }
  dpr = nextDpr; logoWidth = nextWidth; logoHeight = nextHeight;
  logoCanvas.width = window.innerWidth * dpr;
  logoCanvas.height = window.innerHeight * dpr;
}

window.addEventListener('mousemove', (e) => {
  logoMouseX = e.clientX; logoMouseY = e.clientY; logoActive = true;
});
document.documentElement.addEventListener('mouseleave', () => { logoActive = false; });
window.addEventListener('blur', () => { logoActive = false; });

let resizeT;
window.addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(resizeLogo, 150);
});



/* ================= LOADER =================
   Sequence:
   t=0→0.35s  — pure black screen (brief pause)
   t=0.35→0.5s — transition buffer
   t=0.5→1.0s — text fades in with blur (8px → 0.5px, smooth 0.5s)
   t=1.0→3.0s — text sharp and visible (2.0s to read)
   t=3.0→4.5s — text blurs out and fades (0.5px → 8px, 1.5s)
   t=4.5s     — loader canvas removed
   
   PAGE REVEAL SEQUENCE:
   t=4.5s     — logo particles start forming (from initLogo)
   t=5.3s     — tagline fades in with blur-in (0.8s)
   t=5.5s     — statement fades in with blur-in (0.8s)
   t=6.0s     — backgrounds begin fade in (1.2s)
   t=7.2s     — backgrounds fully visible
   t=7.3s     — rest of page (nav, services, footer) stagger in
*/
(function startLoader() {
  var loader = document.getElementById('loader');
  if (loader) loader.style.display = 'none';

  var tagEl      = document.querySelector('.tagline');
  var stmtEl     = document.querySelector('.statement');
  var logoWrapEl = document.getElementById('logoWrap');

  // When loader canvas is done (after blur-out), show DOM text and rest of page
  window._loaderDone = function() {
    if (logoStarted) return;
    motionField.classList.add('visible');
    // Start logo particles immediately
    if (logoWrapEl) {
      logoWrapEl.style.opacity = '1';
      logoWrapEl.classList.remove('enter');
    }
    initLogo();
    
    // Fade in center text (tagline, statement) after logo forms slightly
    // t=0.8s: tagline appears with blur-in (blur 8px→0px, opacity 0→1)
    // t=1.0s: statement appears with blur-in (blur 8px→0px, opacity 0→1)
    setTimeout(() => {
      if (tagEl) tagEl.classList.add('visible');
    }, 800);
    
    setTimeout(() => {
      if (stmtEl) stmtEl.classList.add('visible');
    }, 1000);
    
    
    // Fade in rest of page elements (nav, services, footer, cta)
    // t=2.8s: start the playEntry stagger (logo has ~2.5s to settle)
    setTimeout(() => {
      playEntry();
    }, 2800);
  };
})();

/* ================= STATIC SETTINGS ================= */
document.querySelector('.seam').style.opacity = VIGNETTE.toFixed(2);
document.querySelector('.guides').style.display = 'none';



/* ================= MOBILE SERVICES DRAWER ================= */
(function() {
  const btn     = document.getElementById('mobSvcBtn');
  const drawer  = document.getElementById('mobSvcDrawer');
  const overlay = document.getElementById('mobSvcOverlay');
  const closeBtn= document.getElementById('mobSvcClose');
  const list    = document.getElementById('mobSvcList');
  if (!btn) return;

  // Populate drawer list from the same SERVICES data
  SERVICES.forEach((s, i) => {
    const item = document.createElement('button');
    item.type = 'button';
    item.style.width = '100%';
    item.style.textAlign = 'left';
    item.className = 'mob-svc-item';
    item.innerHTML = `
      <div class="mob-svc-item-left">
        <span class="mob-svc-item-num">${s.num}</span>
        <span class="mob-svc-item-title">${s.title}</span>
      </div>
      <span class="mob-svc-item-arrow">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </span>`;
    item.addEventListener('click', () => {
      closeDrawer();
      // Trigger the existing service modal
      const strip = document.getElementById('services-strip');
      if (strip) {
        const svcs = strip.querySelectorAll('.svc');
        if (svcs[i]) svcs[i].click();
      }
    });
    list.appendChild(item);
  });

  function openDrawer() {
    drawer.classList.add('open');
    overlay.classList.add('open');
    btn.classList.add('open');
    drawer.setAttribute('aria-hidden','false');
    document.body.style.overflow = 'hidden';
  }
  function closeDrawer() {
    drawer.classList.remove('open');
    overlay.classList.remove('open');
    btn.classList.remove('open');
    drawer.setAttribute('aria-hidden','true');
    document.body.style.overflow = '';
  }

  btn.addEventListener('click', () => {
    drawer.classList.contains('open') ? closeDrawer() : openDrawer();
  });
  closeBtn.addEventListener('click', closeDrawer);
  overlay.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && drawer.classList.contains('open')) { closeDrawer(); btn.focus(); }
  });
})();

/* ================= GYROSCOPE PARALLAX (mobile) ================= */
(function() {
  // Only activate on touch devices with DeviceOrientation support
  if (!('ontouchstart' in window)) return;

  let gyroX = 0, gyroY = 0;        // smoothed orientation offset
  let tGyroX = 0, tGyroY = 0;      // target
  let hasGyro = false;
  let baseBeta = null, baseGamma = null;

  // Request permission on iOS 13+
  function startGyro() {
    if (typeof DeviceOrientationEvent === 'undefined') return;
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission()
        .then(state => { if (state === 'granted') bindGyro(); })
        .catch(() => {});
    } else {
      bindGyro();
    }
  }

  function bindGyro() {
    window.addEventListener('deviceorientation', (e) => {
      if (e.beta == null || e.gamma == null) return;
      if (!hasGyro) {
        // Capture baseline on first reading
        baseBeta  = e.beta  || 0;
        baseGamma = e.gamma || 0;
        hasGyro = true;
        return;
      }
      // delta from baseline, clamped to ±30°
      const db = Math.max(-30, Math.min(30, (e.beta  || 0) - baseBeta));
      const dg = Math.max(-30, Math.min(30, (e.gamma || 0) - baseGamma));
      // Map ±30° → ±strength px
      const strength = 18;
      tGyroX =  (dg / 30) * strength;  // tilt left/right → X
      tGyroY =  (db / 30) * strength;  // tilt forward/back → Y
    }, true);

    // Smooth tilt into a subtle physical logo shift. Motion speed also controls
    // whether disturbed logo particles are allowed to leave for the rain field.
    let lastFrame = performance.now();
    function gyroTick() {
      const now = performance.now();
      const dt = Math.max(1 / 120, Math.min(0.05, (now - lastFrame) / 1000));
      lastFrame = now;
      const prevX = gyroX, prevY = gyroY;
      gyroX += (tGyroX - gyroX) * 0.06;
      gyroY += (tGyroY - gyroY) * 0.06;
      if (hasGyro) {
        window._gyroOffsetX = gyroX;
        window._gyroOffsetY = gyroY;
        window._gyroVelocityX = (gyroX - prevX) / dt;
        window._gyroVelocityY = (gyroY - prevY) / dt;
        const instantMotion = Math.hypot(gyroX - prevX, gyroY - prevY);
        window._gyroMotion = Math.max(instantMotion, (window._gyroMotion || 0) * 0.9);
        logoWrap.style.transform = `translate3d(${gyroX * 0.58}px, ${gyroY * 0.58}px, 0)`;
      }

      requestAnimationFrame(gyroTick);
    }
    requestAnimationFrame(gyroTick);

    // Also drive particle repulsion via synthetic mouse position
    const logoCanvas = document.getElementById('logoCanvas');
    if (logoCanvas) {
      function updateLogoGyro() {
        if (!hasGyro) { requestAnimationFrame(updateLogoGyro); return; }
        const rect = logoWrap.getBoundingClientRect();
        // Map gyro offset to a point within the canvas
        window._gyroLogoX = rect.left + rect.width  * 0.5 + gyroX * 2.6;
        window._gyroLogoY = rect.top  + rect.height * 0.5 + gyroY * 2.6;
        requestAnimationFrame(updateLogoGyro);
      }
      requestAnimationFrame(updateLogoGyro);
    }
  }

  // Trigger on first touch (needed for iOS permission flow)
  document.addEventListener('touchstart', function onFirst() {
    document.removeEventListener('touchstart', onFirst);
    startGyro();
  }, { once: true });
})();
</script>
